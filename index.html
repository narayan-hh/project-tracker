<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Workstation</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="sections.css">
<link rel="stylesheet" href="ambience.css">
<link rel="stylesheet" href="enhance.css">
<link rel="stylesheet" href="themes.css">
<link rel="stylesheet" href="legibility.css">
<link rel="stylesheet" href="tools.css">
<link rel="stylesheet" href="polish.css">
<link rel="stylesheet" href="dashboard.css">
</head>
<body class="theme-forest">
<script>
/* set the saved theme before anything paints */
try{var _t=localStorage.getItem("pt_theme_v1");if(_t)document.body.className="theme-"+_t;}catch(e){}
</script>

<!-- The living forest. Everything inside is drawn by ambience.js -->
<div class="world" id="world" aria-hidden="true"></div>

<!-- The title, lettered across the sky above the treeline -->
<div class="sky-title" id="skytitle" aria-hidden="true">
  <h1 id="sky-h1">My Workstation</h1>
  <p id="sky-sub"></p>
</div>

<!-- A button, not an anchor: every in-page href goes through the
     router, and "#view" is not a route. -->
<button class="skip" id="skip" type="button">Skip to the page</button>

<!-- ===== top bar: menu on the left, weather on the right ===== -->
<header class="topbar">
  <button class="burger" id="burger" type="button" aria-label="Show or hide the menu"
          aria-controls="sidebar" aria-expanded="true">
    <span></span><span></span><span></span>
  </button>
  <a class="brand" href="#/" title="Back to the home page">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"
         aria-hidden="true" focusable="false">
      <path d="M21 3C10 3 3 9 3 18c0 1 0 2 .3 3 1-6 5-10 11-12-4 3-7 6-8 12 8 1 14-4 14-13V3z"/>
    </svg>
    My Workstation
  </a>
  <span class="spacer"></span>
  <div class="topbar-tools">
    <button class="tbtn" id="btn-search" type="button" aria-label="Search everything"
            title="Search everything  (Ctrl+K)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.3-4.3"/></svg>
      <span>Search</span>
      <kbd class="tbtn-key">Ctrl K</kbd>
    </button>
    <button class="tbtn primary" id="btn-ask" type="button" aria-label="Ask a question"
            title="Ask a question about your records">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
           aria-hidden="true" focusable="false">
        <path d="M12 3a9 9 0 1 0 4.5 16.8L21 21l-1.2-4.5A9 9 0 0 0 12 3z"/>
        <path d="M9.2 9.5a2.8 2.8 0 1 1 3.6 2.7c-.5.2-.8.6-.8 1.1v.4"/><path d="M12 16.4h.01"/>
      </svg>
      <span>Ask</span>
    </button>
  </div>
</header>

<!-- ===== full-screen shell: menu on the left, page on the right ===== -->
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main id="view" class="view" tabindex="-1"></main>
</div>
<div class="scrim" id="scrim"></div>

<!-- Near trees, animals and weather — drawn IN FRONT of the pages -->
<div class="foreground" id="foreground" aria-hidden="true"></div>

<!-- Local KPI figures. Gitignored and never pushed, so on the public
     site this 404s harmlessly and the KPI tables start empty. -->
<script src="kpi-data.local.js"></script>
<script src="ambience.js"></script>
<script src="data.js"></script>
<script src="ui.js"></script>
<script src="xlsx.js"></script>
<script src="importer.js"></script>
<script src="review.js"></script>
<script src="views.js"></script>
<script src="views2.js"></script>
<script src="sync.js"></script>
<script src="kpi-remote.js"></script>
<script src="app.js"></script>
<script src="actions2.js"></script>
<script src="palette.js"></script>
<script src="ask.js"></script>
<script src="themes.js"></script>
</body>
</html>
